<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <style>
        /* Kono margin, padding ba scrollbar thakbe na */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Scrollbar bondho korbe */
            background-color: #000; /* Jodi chobi na dhore kalo dekhate chao */
        }

        /* Chobita puro screen e boshbe */
        img {
            width: 100%;
            height: 100vh;
            object-fit: contain; /* Chobi ta screen e fit hobe, kintu kete jabe na */
            /* Jodi chao chobi ta kete hole o puro screen bhore jay, tahole 'contain' er jaygay 'cover' likho */
        }
    </style>
</head>
<body>
    <img src="image.jpeg" alt="">
</body>
</html>
